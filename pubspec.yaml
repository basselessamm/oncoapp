name: onco_repurpose_ai
description: >-
  A research tool for browsing gene-drug interactions recorded in public
  databases, for cancer transcriptomics. Research use only.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1 # Adding provider for state management
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  url_launcher: ^6.3.2
  file_picker: ^8.1.7
  csv: ^6.0.0
  # Pinned deliberately: this is the only dependency that sends data off-device.
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Individual files, not directories. Declaring the two data directories
  # bundled roughly 8 MB that no code reads: basal_vs_normal_unfiltered.json
  # (4.1 MB, 19,499 unfiltered genes, never loaded) and three raw .tsv source
  # files (3.8 MB) kept in the repository for provenance.
  assets:
    - assets/icon.png
    - assets/db/master_drugs.db
    - assets/data/Breast_Invasive_Carcinoma_TCGA/tcga_signatures.json
    - assets/data/Triple_Negative_Breast_Cancer_DLDCCC/basal_like1_vs_mesenchymal.json
    - assets/data/Triple_Negative_Breast_Cancer_DLDCCC/immunomodulatory_vs_luminal_androgen.json
    - assets/data/Triple_Negative_Breast_Cancer_DLDCCC/mesenchymal_vs_immunomodulatory.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"

flutter_native_splash:
  color: "#FCE4EC"
  image: "assets/icon.png"
  android: true
  ios: true
  fullscreen: true
  
  android_12:
    image: "assets/icon.png"
    color: "#FCE4EC"
